<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Ícone da aba. O "s" é recortado do próprio lettering da marca
    (logo-supera.png) e vem embutido em base64: um favicon que busca arquivo
    externo falha em parte dos navegadores, e falha justamente onde ninguém
    olha. Gerado por simbolo.local.mjs.

    Fundo claro, e não o verde da marca: o glifo É verde, e verde sobre verde
    desaparece aos 16 px da aba. O quadrado claro dá contorno nas duas barras,
    clara e escura.
  -->
  <rect width="32" height="32" rx="7" fill="#f4f2ec"/>
  <image href="data:image/png;base64," x="4" y="4" width="24" height="24"/>
</svg>
